apiVersion: v1
type: cli/v1
name: schema
version: 0.1.0
runtime: subprocess
sourceURL: https://github.com/arch-anes/helm-schema
config:
  usage: schema [CHART]
  shortHelp: Generate values.schema.json from Helm template usage
  longHelp: Generate a Helm values schema from values used by chart templates.
  ignoreFlags: false
runtimeConfig:
  platformCommand:
    - os: windows
      command: '${HELM_PLUGIN_DIR}\bin\helm-schema.exe'
    - command: '${HELM_PLUGIN_DIR}/bin/helm-schema'
  platformHooks:
    install:
      - os: windows
        command: powershell
        args:
          - -NoProfile
          - -ExecutionPolicy
          - Bypass
          - -File
          - '${HELM_PLUGIN_DIR}\install.ps1'
      - command: '${HELM_PLUGIN_DIR}/install.sh'
